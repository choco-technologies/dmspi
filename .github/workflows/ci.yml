name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-test-core:
    name: Build and Test dmspi (core)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: chocotechnologies/dmod:1.0.4

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build dmspi core module
        run: |
          mkdir -p build
          cd build
          # dmspi links against dmspi_port_if (headers only), so building it
          # never touches src/port/*/port.c. dmspi_port itself is also built
          # here (against src/port/x86_64's software-loopback stub, selected
          # via DMOD_CPU_FAMILY) purely so dmod_loader has something to
          # satisfy dmspi's runtime dmspi_port dependency below - there is
          # no published x86_64 release of the real hardware port.
          cmake .. -DDMOD_MODE=DMOD_MODULE -DDMOD_TOOLS_NAME=arch/x86_64 -DDMOD_CPU_FAMILY=x86_64
          cmake --build . --target dmspi dmspi_port test_dmspi

      - name: Verify module files
        run: |
          echo "Checking for module files..."
          ls -lh build/dmf/
          test -f build/dmf/dmspi.dmf
          test -f build/dmf/dmspi_version.txt
          test -f build/dmf/test_dmspi.dmf
          test -f build/dmf/dmspi_port.dmf
          echo "Module files present"

      - name: Run tests with dmod_loader
        run: |
          export DMOD_DMF_DIR=$(pwd)/build/dmf
          # dmod_link_modules only fetches headers at configure time; dmspi's
          # own runtime dependencies (e.g. dmhaman) still need to be staged
          # into build/dmf before dmod_loader can resolve them, same as the
          # ctest target defined in tests/CMakeLists.txt already does.
          # dmspi.dmd also lists dmspi_port, which has no published x86_64
          # release (only the real stm32f4/stm32f7 hardware ports are
          # published) - the build step above already placed our own
          # x86_64 dmspi_port.dmf (the loopback stub) in build/dmf, so
          # `|| true` just lets dmf-get's redundant remote lookup for it
          # fail without masking a real failure to fetch dmhaman/dmini/
          # dm_sw_ring.
          dmf-get install -d build/dmf/dmspi.dmd -y || true
          dmod_loader build/dmf/test_dmspi.dmf

  discover-cpu-families:
    name: Discover CPU Families
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      cpu_families: ${{ steps.list-families.outputs.cpu_families }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: List available CPU families
        id: list-families
        run: |
          # Find all CPU families by looking for directories containing port.c
          CPU_FAMILIES=$(find src/port -mindepth 2 -maxdepth 2 -name "port.c" -type f -printf '%h\n' | \
            xargs -n1 basename | \
            sort | \
            jq -R -s -c 'split("\n") | map(select(length > 0))')

          echo "Found CPU families: $CPU_FAMILIES"
          echo "cpu_families=$CPU_FAMILIES" >> $GITHUB_OUTPUT

  build-dmspi:
    name: Build dmspi for ${{ matrix.cpu_family }}
    needs: discover-cpu-families
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        cpu_family: ${{ fromJson(needs.discover-cpu-families.outputs.cpu_families) }}

    container:
      image: chocotechnologies/dmod:1.0.4

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build dmspi for ${{ matrix.cpu_family }}
        run: |
          set -e
          CPU_FAMILY="${{ matrix.cpu_family }}"
          mkdir -p build_$CPU_FAMILY
          cd build_$CPU_FAMILY

          cmake .. -DDMOD_CPU_FAMILY="${CPU_FAMILY}"
          cmake --build .

          echo "Build completed for CPU family: ${CPU_FAMILY}"
          ls -lh dmf/

      - name: Verify dmspi_port module files
        run: |
          CPU_FAMILY="${{ matrix.cpu_family }}"
          echo "Checking for dmspi_port module files for ${CPU_FAMILY}..."
          ls -lh build_$CPU_FAMILY/dmf/
          test -f build_$CPU_FAMILY/dmf/dmspi_port.dmf
          test -f build_$CPU_FAMILY/dmf/dmspi_port_version.txt
          echo "Module files present for ${CPU_FAMILY}"
