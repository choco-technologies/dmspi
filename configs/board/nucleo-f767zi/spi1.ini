; NUCLEO-F767ZI SPI1 (Arduino Uno V3 connector D13/D12/D11)
;
; Verified against Zephyr's nucleo_f767zi.dts (real, working board config -
; pinctrl-0 = <&spi1_sck_pa5 &spi1_miso_pa6 &spi1_mosi_pa7>): D13(SCK)=PA5,
; D12(MISO)=PA6, D11(MOSI)=PA7. D10(CS) is PD14 per the same source
; (listed alongside the SPI pins) but that specific pin/signal pairing was
; not independently cross-checked, unlike SCK/MISO/MOSI above - confirm
; PD14 against UM1974 before trusting [arduino_spi_cs] below on real
; hardware.
;
; IMPORTANT: the same Zephyr doc explicitly warns "The Arduino Uno v3
; specified SPI device conflicts with the on-board ETH device on pin PA7"
; (shared with ETH_CRS_DV) - whether PA7 is actually free for SPI depends
; on this board's solder-bridge configuration (see UM1974's solder bridge
; table). Confirm PA7 isn't routed to the Ethernet PHY on your board
; before relying on this.
;
; alternate_function=5 follows the STM32F4/F7 convention that SPI1 uses
; the same AF number on every pin it can be routed to; not independently
; checked against the Port A alternate-function table for this specific
; part - verify against the datasheet before relying on it.
;
; CS is not part of the SPI peripheral (nss_mode=soft) - [arduino_spi_cs]
; below configures D10 (PD14) as a plain dmgpio output, and
; [arduino_spi]'s cs_path points dmspi at the resulting device
; (/dev/dmgpio3/arduino_spi_cs - port index 3 = port D; see
; docs/configuration.md's "Chip select" section for the path format,
; confirmed on real hardware for a different board/port) so dmspi drives
; it low/high around every transfer automatically - assuming a single
; shield device on D10 and that the PD14 guess above is right. For a
; shield that uses a different CS pin, remove cs_path from [arduino_spi]
; and drive CS yourself instead.

[arduino_spi_sck]
driver_name=dmgpio
driver_order=3
pin=PA5
mode=alternate
alternate_function=5
speed=maximum
output_circuit=push_pull
pull=none

[arduino_spi_miso]
driver_name=dmgpio
driver_order=3
pin=PA6
mode=alternate
alternate_function=5
pull=none

[arduino_spi_mosi]
driver_name=dmgpio
driver_order=3
pin=PA7
mode=alternate
alternate_function=5
speed=maximum
output_circuit=push_pull
pull=none

[arduino_spi_cs]
driver_name=dmgpio
driver_order=3
pin=PD14
mode=output
pull=up
speed=maximum
output_circuit=push_pull

[arduino_spi]
driver_name=dmspi
driver_order=3
instance=1
role=master
baudrate=1000000
mode=0
bit_order=msb_first
nss_mode=soft
cs_path=/dev/dmgpio3/arduino_spi_cs
cs_active_level=low

