; NUCLEO-F411RE SPI1 (Arduino Uno V3 connector D13/D12/D11)
;
; Verified against UM1724 "STM32 Nucleo-64 boards" (Arduino connector
; table): D13(SCK)=PA5, D12(MISO)=PA6, D11(MOSI)=PA7, D10(CS)=PB6.
;
; alternate_function=5 follows the STM32F4/F7 convention that SPI1 uses
; the same AF number on every pin it can be routed to; not independently
; checked against the Port A alternate-function table for this specific
; part - verify against the datasheet before relying on it.
;
; D10 (PB6) is the Arduino-standard CS/SS pin - [arduino_spi_cs] below
; configures it as a plain dmgpio output, and [arduino_spi]'s cs_path
; points dmspi at the resulting device (mounted under /dev/arduino_spi_cs)
; so dmspi drives it low/high around every transfer automatically. This
; assumes a single shield device on D10, the common case - for a shield
; that uses a different CS pin, or manages multiple devices itself,
; remove cs_path from [arduino_spi] and drive CS yourself instead.
; [arduino_spi_cs] must stay declared before [arduino_spi] in this file
; for cs_path to resolve to an existing device.

[arduino_spi_sck]
driver_name=dmgpio
driver_order=3
pin=PA5
mode=alternate
alternate_function=5
speed=maximum
output_circuit=push_pull
pull=none

[arduino_spi_miso]
driver_name=dmgpio
driver_order=3
pin=PA6
mode=alternate
alternate_function=5
pull=none

[arduino_spi_mosi]
driver_name=dmgpio
driver_order=3
pin=PA7
mode=alternate
alternate_function=5
speed=maximum
output_circuit=push_pull
pull=none

[arduino_spi_cs]
driver_name=dmgpio
driver_order=3
pin=PB6
mode=output
pull=up
speed=maximum
output_circuit=push_pull

[arduino_spi]
driver_name=dmspi
driver_order=3
instance=1
role=master
baudrate=1000000
mode=0
bit_order=msb_first
nss_mode=soft
cs_path=/dev/arduino_spi_cs
cs_active_level=low

