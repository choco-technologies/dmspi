; STM32F429I-DISCOVERY SPI5 - onboard L3GD20 gyroscope
;
; Pins verified against UM1670 "Discovery kit with STM32F429ZI MCU" and its
; schematic pack (MB1075-F429I-C01): SCK=PF7, MISO=PF8, MOSI=PF9, CS=PC1.
;
; alternate_function=5 follows the STM32F4/F7 convention that SPI5 uses
; the same AF number on every pin it can be routed to; not independently
; checked against the Port F alternate-function table for this specific
; part - verify against the datasheet before relying on it.
;
; mode=3 (CPOL=1, CPHA=1) matches the L3GD20 datasheet (clock idles high,
; data sampled on the falling edge).
;
; CS is not part of the SPI peripheral (nss_mode=soft) - [gyro_cs] below
; configures PC1 as a plain dmgpio output, and [gyro_spi]'s cs_path points
; dmspi at the resulting device (mounted under /dev/gyro_cs) so dmspi
; drives it low/high around every transfer automatically. [gyro_cs] must
; stay declared before [gyro_spi] in this file for cs_path to resolve to
; an existing device.

[gyro_spi_sck]
driver_name=dmgpio
driver_order=3
pin=PF7
mode=alternate
alternate_function=5
speed=maximum
output_circuit=push_pull
pull=none

[gyro_spi_miso]
driver_name=dmgpio
driver_order=3
pin=PF8
mode=alternate
alternate_function=5
pull=none

[gyro_spi_mosi]
driver_name=dmgpio
driver_order=3
pin=PF9
mode=alternate
alternate_function=5
speed=maximum
output_circuit=push_pull
pull=none

[gyro_cs]
driver_name=dmgpio
driver_order=3
pin=PC1
mode=output
pull=up
speed=maximum
output_circuit=push_pull

[gyro_spi]
driver_name=dmspi
driver_order=3
instance=5
role=master
baudrate=1000000
mode=3
bit_order=msb_first
nss_mode=soft
cs_path=/dev/gyro_cs
cs_active_level=low
