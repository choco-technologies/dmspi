; NUCLEO-F401RE SPI1 (Arduino Uno V3 connector D13/D12/D11)
;
; Verified against UM1724 "STM32 Nucleo-64 boards" (Arduino connector
; table): D13(SCK)=PA5, D12(MISO)=PA6, D11(MOSI)=PA7, D10(CS)=PB6.
;
; alternate_function=5 follows the STM32F4/F7 convention that SPI1 uses
; the same AF number on every pin it can be routed to; not independently
; checked against the Port A alternate-function table for this specific
; part - verify against the datasheet before relying on it.
;
; D10 (PB6) is the Arduino-standard CS/SS pin. It is exposed as a separate
; dmgpio friend below and dmspi drives it through its dmdevfs path.

[arduino_spi_sck]
driver_name=dmgpio
driver_order=2
friends_group=arduino_spi
pin=PA5
mode=alternate
alternate_function=5
speed=maximum
output_circuit=push_pull
pull=none

[arduino_spi_miso]
driver_name=dmgpio
driver_order=2
friends_group=arduino_spi
pin=PA6
mode=alternate
alternate_function=5
pull=none

[arduino_spi_mosi]
driver_name=dmgpio
driver_order=2
friends_group=arduino_spi
pin=PA7
mode=alternate
alternate_function=5
speed=maximum
output_circuit=push_pull
pull=none

[arduino_spi]
driver_name=dmspi
driver_order=2
friends_group=arduino_spi
instance=1
role=master
baudrate=1000000
mode=0
bit_order=msb_first
nss_mode=soft
cs_active_level=low

[arduino_spi_cs]
driver_name=dmgpio
driver_order=2
friends_group=arduino_spi
friend_role=chip_select
pin=PB6
mode=output
pull=up
speed=maximum
output_circuit=push_pull
