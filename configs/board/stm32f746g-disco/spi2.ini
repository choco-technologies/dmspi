; STM32F746G-DISCO SPI2 (Arduino Uno V3 connector D13/D12/D11)
;
; Verified against UM1907 "Discovery kit for STM32F7 series with STM32F746NG
; MCU", Table 3 "Arduino Connectors (CN4, CN5, CN6, CN7)":
;   D13 (SCK)  -> PI1
;   D12 (MISO) -> PB14
;   D11 (MOSI) -> PB15
;   D10 (NSS)  -> PI0
; This is SPI2, not SPI1 - PA5/PA6/PA7 are used on this board for
; USB_OTG_HS_ULPI/DCMI/Ethernet instead, so the Arduino SPI header is
; rerouted to SPI2 on different pins entirely.
;
; alternate_function=5 follows the STM32F4/F7 convention that a given SPI
; instance uses the same AF number on every pin it can be routed to (SPI1/
; SPI2/SPI4/SPI5/SPI6 = AF5, SPI3 = AF6); it was not independently checked
; against the Port I/Port B alternate-function table for this specific
; part - verify against the datasheet before relying on it.
;
; CS is not part of the SPI peripheral (nss_mode=soft) - [arduino_spi_cs]
; below configures D10 (PI0) as a plain dmgpio output, and [arduino_spi]'s
; cs_path points dmspi at the resulting device so dmspi drives it low/high
; around every transfer automatically - assuming a single shield device on
; D10. For a shield that uses a different CS pin, remove cs_path from
; [arduino_spi] and drive CS yourself instead.
;
; The path is /dev/dmgpio<port_index>/<section_name>, NOT a flat
; /dev/<section_name> - confirmed on real STM32F746G-DISCO hardware: dmgpio
; mounts each alt-named device under a per-port class directory
; (port_index: A=0, B=1, ... I=8, so PI0 -> dmgpio8). Getting this wrong
; makes dmspi's Dmod_FileOpen(cs_path) fail at create time (logged, not a
; hang - dmdevfs just reports "Failed to configure driver: dmspi" and boot
; continues).

[arduino_spi_sck]
driver_name=dmgpio
driver_order=3
pin=PI1
mode=alternate
alternate_function=5
speed=maximum
output_circuit=push_pull
pull=none

[arduino_spi_miso]
driver_name=dmgpio
driver_order=3
pin=PB14
mode=alternate
alternate_function=5
pull=none

[arduino_spi_mosi]
driver_name=dmgpio
driver_order=3
pin=PB15
mode=alternate
alternate_function=5
speed=maximum
output_circuit=push_pull
pull=none

[arduino_spi_cs]
driver_name=dmgpio
driver_order=3
pin=PI0
mode=output
pull=up
speed=maximum
output_circuit=push_pull

[arduino_spi]
driver_name=dmspi
driver_order=3
instance=2
role=master
baudrate=1000000
mode=0
bit_order=msb_first
nss_mode=soft
cs_path=/dev/dmgpio8/arduino_spi_cs
cs_active_level=low
