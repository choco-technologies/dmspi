; STM32F4-DISCOVERY SPI1 - onboard MEMS motion sensor (LIS3DSH on later
; board revisions, LIS302DL on early ones - both wired the same way)
;
; Pins: PA5 (SCK), PA6 (MISO), PA7 (MOSI), PE3 (CS) - cross-checked against
; multiple independent sources (ST community threads and a stm32f4-discovery.net
; writeup) rather than the UM1472 schematic directly (couldn't fetch the PDF
; itself in this session) - the CS=PE3 value in particular is corroborated
; by working example code (HAL_GPIO_WritePin(GPIOE, GPIO_PIN_3, ...)) in
; more than one place, but verify against your board's schematic
; (MB997-Cxx) before relying on it.
;
; alternate_function=5 follows the STM32F4/F7 convention that SPI1 uses
; the same AF number on every pin it can be routed to; not independently
; checked against the Port A alternate-function table for this specific
; part - verify against the datasheet before relying on it.
;
; mode=3 (CPOL=1, CPHA=1) matches the LIS3DSH datasheet (clock idles high)
; and is confirmed by ST's own community answers for the same MEMS family.
;
; CS is not part of the SPI peripheral (nss_mode=soft) - dmspi claims and
; drives PE3 directly via cs_pin=PE3 below (dmgpio's pin-lease API, see
; docs/configuration.md's "Chip select" section), so no separate dmgpio
; section is needed for it.

[mems_spi_sck]
driver_name=dmgpio
driver_order=3
pin=PA5
mode=alternate
alternate_function=5
speed=maximum
output_circuit=push_pull
pull=none

[mems_spi_miso]
driver_name=dmgpio
driver_order=3
pin=PA6
mode=alternate
alternate_function=5
pull=none

[mems_spi_mosi]
driver_name=dmgpio
driver_order=3
pin=PA7
mode=alternate
alternate_function=5
speed=maximum
output_circuit=push_pull
pull=none

[mems_spi]
driver_name=dmspi
driver_order=3
instance=1
role=master
baudrate=1000000
mode=3
bit_order=msb_first
nss_mode=soft
cs_pin=PE3
cs_active_level=low
