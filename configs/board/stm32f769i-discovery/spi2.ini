; STM32F769I-DISCOVERY SPI2 (Arduino Uno V3 connector D13/D12/D11)
;
; Verified against UM2033 "Discovery kit with STM32F769NI MCU" (Arduino
; connector pinout table):
;   D13 (SCK)  -> PH6
;   D12 (MISO) -> PJ4
;   D11 (MOSI) -> PJ3
;   D10 (NSS)  -> PF7
; This is SPI2, not SPI1 - as on STM32F746G-DISCO, PA5/PA6/PA7 are already
; used elsewhere on this board, so the Arduino SPI header is rerouted to
; SPI2 on different pins entirely.
;
; alternate_function=5 follows the STM32F4/F7 convention that a given SPI
; instance uses the same AF number on every pin it can be routed to (SPI1/
; SPI2/SPI4/SPI5/SPI6 = AF5, SPI3 = AF6); it was not independently checked
; against the Port H/Port J alternate-function table for this specific
; part - verify against the datasheet before relying on it.
;
; CS is not part of the SPI peripheral (nss_mode=soft) - [arduino_spi_cs]
; below configures D10 (PF7) as a plain dmgpio output, and
; [arduino_spi]'s cs_path points dmspi at the resulting device
; (/dev/dmgpio5/arduino_spi_cs - port index 5 = port F; see
; docs/configuration.md's "Chip select" section for the path format,
; confirmed on real hardware for a different board/port, and why the open
; happens lazily, on first transfer, not at boot) so dmspi drives it
; low/high around every transfer automatically - assuming a single shield
; device on D10. For a shield that uses a different CS pin, remove
; cs_path from [arduino_spi] and drive CS yourself instead.

[arduino_spi_sck]
driver_name=dmgpio
driver_order=3
pin=PH6
mode=alternate
alternate_function=5
speed=maximum
output_circuit=push_pull
pull=none

[arduino_spi_miso]
driver_name=dmgpio
driver_order=3
pin=PJ4
mode=alternate
alternate_function=5
pull=none

[arduino_spi_mosi]
driver_name=dmgpio
driver_order=3
pin=PJ3
mode=alternate
alternate_function=5
speed=maximum
output_circuit=push_pull
pull=none

[arduino_spi_cs]
driver_name=dmgpio
driver_order=3
pin=PF7
mode=output
pull=up
speed=maximum
output_circuit=push_pull

[arduino_spi]
driver_name=dmspi
driver_order=3
instance=2
role=master
baudrate=1000000
mode=0
bit_order=msb_first
nss_mode=soft
cs_path=/dev/dmgpio5/arduino_spi_cs
cs_active_level=low
