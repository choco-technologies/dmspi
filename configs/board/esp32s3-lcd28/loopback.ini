; Waveshare ESP32-S3-Touch-LCD-2.8: a test bus on the spare header pins, without a wire: MOSI and MISO are the same pad (GPIO18; the
; pad drives itself and reads itself), SCLK = GPIO15. What is sent comes back. Select this file OR lcd_spi.ini (the same controller).
[loopback_spi]
driver_name=dmspi
driver_order=2
instance=2
role=master
baudrate=10000000
mode=0
nss_mode=soft
sck_pin=15
mosi_pin=18
miso_pin=18
