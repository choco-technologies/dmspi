; Waveshare ESP32-S3-Touch-LCD-2.8: the bus of the ST7789 display (240x320): SCLK = GPIO40, MOSI = GPIO45, no MISO.
; The other lines of the display are GPIOs for its driver: CS = GPIO42, DC = GPIO41, RST = GPIO39, backlight = GPIO5.
; nss_mode=soft: the chip select is a GPIO (a friend of dmspi), one frame is longer than the 64 bytes of a transaction.
; Select this file OR another board's, never both.
[lcd_spi]
driver_name=dmspi
driver_order=2
instance=2
role=master
baudrate=40000000
mode=0
nss_mode=soft
sck_pin=40
mosi_pin=45
