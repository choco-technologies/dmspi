; esp32s3: controller defaults only; the pads are chosen in a board INI (sck_pin, mosi_pin, miso_pin: the GPIO matrix routes the
; signals, there are no fixed pads). The instance is the number in the name of the controller: 2 = GP-SPI2, 3 = GP-SPI3.
[dmspi]
instance=2
role=master
baudrate=1000000
mode=0
nss_mode=soft
driver_order=2
